      <!-- TAULA -->
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Plat Principal</th>
            <th>Acompanyament 1</th>
            <th>Acompanyament 2</th>
            <th>Al·lèrgens</th>
            <th>Preu</th>
            <th>Accions</th>
          </tr>
        </thead>
        <tbody id="tabla-combinats"></tbody>
      </table>

      <!-- FORMULARI -->
      <form id="formulariPlat" action="#" method="post">
        <h2>Afegir Plat Combinat</h2>

        <label>
          Plat Principal:
          <input type="text" name="nom" id="nom" required>
        </label>

        <!-- Acompanyament 1 -->
        <label>
          Acompanyament 1:
          <div class="seleccio-visual">
            <input type="radio" id="acomp1_patates" name="acomp1" value="patates_base" required>
            <label for="acomp1_patates">
              <span class="icona-producte">🍟</span> Patates fregides</label>

            <input type="radio" id="acomp1_ou" name="acomp1" value="ou_fregit">
            <label for="acomp1_ou">
              <span class="icona-producte">🍳</span> Ou fregit</label>

            <input type="radio" id="acomp1_bacon" name="acomp1" value="carn">
            <label for="acomp1_bacon">
              <span class="icona-producte">🥓</span> Bacon</label>
          </div>
        </label>

        <!-- Acompanyament 2 -->
        <label>
          Acompanyament 2:
          <div class="seleccio-visual">
            <input type="radio" id="acomp2_amanida" name="acomp2" value="amanida_base" required>
            <label for="acomp2_amanida">
              <span class="icona-producte">🥗</span> Amanida
            </label>

            <input type="radio" id="acomp2_arros" name="acomp2" value="arros_industrial">
            <label for="acomp2_arros">
              <span class="icona-producte">🍚</span> Arròs Blanc
            </label>
            <input type="radio" id="acomp2_amanida_pasta" name="acomp2" value="amanida_guarnisio_alegics" required>
            <label for="acomp2_amanida_pasta">
              <span class="icona-producte">🥗🍝</span> Amanida de pasta
            </label>
          </div>
        </label>

        <label>
          Preu (€):
          <input type="number" name="precio" step="0.01" required>
        </label>

        <br>
        <button type="submit">Afegir Plat</button>
      </form>
    </div>
